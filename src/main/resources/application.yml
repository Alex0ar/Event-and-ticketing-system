spring:
  application:
    name: ticketflow
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum-length}
    access-token-ttl: 900
    refresh-token-ttl: 604800
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    # demo profile only: wipe and reseed on every boot (keeps a sleeping free-tier demo fresh)
    reset-on-startup: ${APP_DEMO_RESET_ON_STARTUP:false}
