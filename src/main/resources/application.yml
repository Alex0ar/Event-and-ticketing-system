spring:
  application:
    name: ticketflow
  profile:
    default: dev
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          format_sql: true
    flyway:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum-length}
    access-token-ttl: 900
    refresh-token-ttl: 604800
