spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health, info

# No default: production must supply a real secret or the app refuses to start.
app:
  jwt:
    secret: ${JWT_SECRET}
